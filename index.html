<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BillKraft 2.0 — The Art of Billing & GST</title>
  <meta name="description" content="Simple, fast & stylish GST billing, POS, inventory, and reports platform for modern businesses." />
  
  <!-- Design System Fonts & Styles -->
  <link rel="stylesheet" href="styles.css?v=3.0" />
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation Shell -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">BK</div>
        <div class="brand-title">BillKraft</div>
        <span class="brand-badge">2.0 PRO</span>
      </div>

      <ul class="nav-menu">
        <li class="nav-item active" id="nav-dashboard">
          <button type="button" data-view="dashboard" onclick="window.navigate('dashboard')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            Dashboard
          </button>
        </li>
        <li class="nav-item" id="nav-gst">
          <button type="button" data-view="gst" onclick="window.navigate('gst')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><path d="M10 9H8"/></svg>
            </span>
            GST Reports & Studio
          </button>
        </li>
        <li class="nav-item" id="nav-invoices">
          <button type="button" data-view="invoices" onclick="window.navigate('invoices')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </span>
            Invoices & Sales
          </button>
        </li>
        <li class="nav-item" id="nav-estimates">
          <button type="button" data-view="estimates" onclick="window.navigate('estimates')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
            </span>
            Estimates & Quotations
          </button>
        </li>
        <li class="nav-item" id="nav-purchases">
          <button type="button" data-view="purchases" onclick="window.navigate('purchases')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </span>
            Purchases & Vendor Bills
          </button>
        </li>
        <li class="nav-item" id="nav-orders">
          <button type="button" data-view="orders" onclick="window.navigate('orders')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
            </span>
            Orders (PO & SO)
          </button>
        </li>
        <li class="nav-item" id="nav-pos">
          <button type="button" data-view="pos" onclick="window.navigate('pos')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M6 16h12"/></svg>
            </span>
            Express POS
          </button>
        </li>
        <li class="nav-item" id="nav-inventory">
          <button type="button" data-view="inventory" onclick="window.navigate('inventory')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            </span>
            Stock & Inventory
          </button>
        </li>
        <li class="nav-item" id="nav-parties">
          <button type="button" data-view="parties" onclick="window.navigate('parties')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/></svg>
            </span>
            Customers & Parties
          </button>
        </li>
        <li class="nav-item" id="nav-eway">
          <button type="button" data-view="eway" onclick="window.navigate('eway')">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            </span>
            E-Way Bills Hub
          </button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="business-card">
          <div class="business-avatar">BK</div>
          <div class="business-info">
            <span class="business-name" id="biz-name">BillKraft India Enterprises</span>
            <span class="business-gst" id="biz-gst">GSTIN: 27AAACB1234C1Z5</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      <!-- Top Navigation & Action Dock Bar -->
      <header class="topbar">
        <div class="page-heading">
          <h1 class="page-title" id="page-title">Dashboard</h1>
          <span class="page-subtitle" id="page-subtitle">Real-time business performance & GST studio</span>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-icon" title="Toggle Light/Dark Theme" onclick="window.toggleTheme()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          
          <button class="btn btn-outline" onclick="window.navigate('pos')">
            ⚡ Quick POS
          </button>
          
          <button class="btn btn-primary" onclick="window.openCreateInvoiceModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            + Create GST Invoice
          </button>
        </div>
      </header>

      <!-- Main Canvas Container -->
      <main class="content-container" id="content-container">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- Dynamic Modal Overlay Root -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card" id="modal-card">
      <!-- Modal Header, Body, and Footer injected dynamically -->
    </div>
  </div>

  <!-- Floating Calculator FAB Button -->
  <button id="floating-calc-btn" class="floating-calc-fab" onclick="window.toggleFloatingCalc()" title="Open Quick GST Calculator">
    🧮
  </button>

  <!-- Floating Draggable GST Calculator Widget -->
  <div id="floating-calc-widget" class="floating-calc-widget" style="display: none;">
    <div class="calc-header" id="calc-header">
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: #fff;">
        <span>🧮</span> Quick GST Calculator
      </div>
      <button class="calc-close-btn" onclick="window.toggleFloatingCalc()">✕</button>
    </div>
    
    <div class="calc-screen">
      <div class="calc-history" id="calc-history">&nbsp;</div>
      <div class="calc-result" id="calc-result">0</div>
    </div>

    <!-- Quick GST Tax Preset Buttons -->
    <div class="calc-gst-presets">
      <button onclick="window.calcApplyGst(5)">+5% GST</button>
      <button onclick="window.calcApplyGst(12)">+12% GST</button>
      <button onclick="window.calcApplyGst(18)">+18% GST</button>
      <button onclick="window.calcApplyGst(28)">+28% GST</button>
    </div>

    <!-- Keypad Grid -->
    <div class="calc-keypad">
      <button class="calc-btn btn-action" onclick="window.calcClear()">C</button>
      <button class="calc-btn btn-action" onclick="window.calcBackspace()">⌫</button>
      <button class="calc-btn btn-action" onclick="window.calcInput('%')">%</button>
      <button class="calc-btn btn-op" onclick="window.calcInput('/')">÷</button>

      <button class="calc-btn" onclick="window.calcInput('7')">7</button>
      <button class="calc-btn" onclick="window.calcInput('8')">8</button>
      <button class="calc-btn" onclick="window.calcInput('9')">9</button>
      <button class="calc-btn btn-op" onclick="window.calcInput('*')">×</button>

      <button class="calc-btn" onclick="window.calcInput('4')">4</button>
      <button class="calc-btn" onclick="window.calcInput('5')">5</button>
      <button class="calc-btn" onclick="window.calcInput('6')">6</button>
      <button class="calc-btn btn-op" onclick="window.calcInput('-')">−</button>

      <button class="calc-btn" onclick="window.calcInput('1')">1</button>
      <button class="calc-btn" onclick="window.calcInput('2')">2</button>
      <button class="calc-btn" onclick="window.calcInput('3')">3</button>
      <button class="calc-btn btn-op" onclick="window.calcInput('+')">+</button>

      <button class="calc-btn" onclick="window.calcInput('0')">0</button>
      <button class="calc-btn" onclick="window.calcInput('00')">00</button>
      <button class="calc-btn" onclick="window.calcInput('.')">.</button>
      <button class="calc-btn btn-equal" onclick="window.calcEvaluate()">=</button>
    </div>
  </div>

  <!-- Core App Logic -->
  <script type="module" src="app.js?v=33.0"></script>
</body>
</html>
